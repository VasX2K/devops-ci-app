name: CI verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "devops-ci-app:${GITHUB_SHA}" .
      - name: Smoke-test container
        run: |
          set -euo pipefail
          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}"
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
          docker exec smoke id
      - name: Tag registry image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "devops-ci-app:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
  deploy:
    name: deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    steps:
      - name: Deploy with Ansible
        run: sudo -n /usr/local/sbin/kr3-deploy "$GITHUB_SHA"
      - name: Check through Nginx
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --max-time 10 http://127.0.0.1/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1/
